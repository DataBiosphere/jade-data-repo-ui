  report-to-sherlock:
    name: Report App Version to Sherlock
    uses: broadinstitute/sherlock/.github/workflows/client-report-app-version.yaml@main
    needs:
      - bump_version
      - update_image
    with:
      new-version: ${{ needs.bump_version.outputs.tag }}
      chart-name: datarepo-ui
    permissions:
      contents: read
      id-token: write

